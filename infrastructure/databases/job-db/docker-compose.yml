services:
  job-postgres:
    image: postgres:16-alpine
    container_name: job-postgres
    restart: always
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - job_postgres_data:/var/lib/postgresql/data

volumes:
  job_postgres_data:
