services:
  redis:
    image: redis:7-alpine
    container_name: it-job-redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    env_file:
      - .env

volumes:
  redis_data: