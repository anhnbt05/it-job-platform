global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "notification-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:3003"]

  - job_name: "organization-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["organization-service:3002"]

  - job_name: "identity-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["identity-service:3001"]

  - job_name: "job-service"
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ["job-service:8082"]

  - job_name: "application-service"
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ["application-service:8083"]

  - job_name: "dashboard-service"
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ["dashboard-service:8084"]
