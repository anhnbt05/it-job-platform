apiVersion: 1

providers:
  - name: "automation-tests"
    orgId: 1
    folder: "Automation Tests"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards/automation
  - name: "overview"
    orgId: 1
    folder: "Overview"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards/core
