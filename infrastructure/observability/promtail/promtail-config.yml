server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: host-app
    pipeline_stages:
      - json:
          expressions:
            service: service
            level: level
            event: event
            method: method
            path: path
            status: status
      - labels:
          service:
          level:
          event:
          method:
          status:
    static_configs:
      - targets:
          - localhost
        labels:
          job: host-app
          __path__: /workspace/runtime-logs/*.log
