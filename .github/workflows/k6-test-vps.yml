name: Performance Test VPS
run-name: Performance ${{ inputs.scenario || 'smoke' }} | ${{ inputs.test_id || format('github-run-{0}', github.run_id) }}

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Performance scenario to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - spike
          - stress
      test_id:
        description: Tag used in Grafana/Prometheus (leave blank to auto-generate)
        required: false
        default: ""
        type: string
      fail_fast:
        description: Stop early on failed checks
        required: false
        default: true
        type: boolean
      prepare_demo_data:
        description: Run migrate/seed before executing performance test
        required: false
        default: false
        type: boolean
      peak_vus:
        description: Override peak VUs for spike/stress (leave blank to use defaults)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: k6-test-vps
  cancel-in-progress: false

jobs:
  k6-test:
    name: Performance Test Job
    runs-on: ubuntu-latest
    env:
      VPS_BACKEND_PATH: ${{ vars.VPS_BACKEND_PATH }}
      SCENARIO_INPUT: ${{ github.event.inputs.scenario }}
      TEST_ID_INPUT: ${{ github.event.inputs.test_id }}
      FAIL_FAST_INPUT: ${{ github.event.inputs.fail_fast }}
      AUTOMATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Mark performance test start
        id: mark_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run performance test on VPS
        id: run_k6
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 45m
          script: |
            set -euo pipefail

            BACKEND_PATH="${VPS_BACKEND_PATH:-/opt/it-job/it-job-platform}"
            SCENARIO="${{ github.event.inputs.scenario || 'smoke' }}"
            TEST_ID="${{ github.event.inputs.test_id || format('github-run-{0}', github.run_id) }}"
            FAIL_FAST_FLAG=false

            if [ "${{ github.event.inputs.fail_fast || 'true' }}" = "true" ]; then
              FAIL_FAST_FLAG=true
            fi

            cd "$BACKEND_PATH"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd

            PEAK_VUS="${{ github.event.inputs.peak_vus || '' }}" PREPARE_DEMO_DATA="${{ github.event.inputs.prepare_demo_data || 'false' }}" FAIL_FAST="$FAIL_FAST_FLAG" bash ./scripts/dev/run-k6-vps.sh "$SCENARIO" "$TEST_ID"

      - name: Wait for Prometheus metrics on VPS
        id: wait_metrics
        if: steps.run_k6.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            BACKEND_PATH="${VPS_BACKEND_PATH:-/opt/it-job/it-job-platform}"
            SCENARIO="${{ github.event.inputs.scenario || 'smoke' }}"
            TEST_ID="${{ github.event.inputs.test_id || format('github-run-{0}', github.run_id) }}"

            cd "$BACKEND_PATH"
            bash ./scripts/dev/wait-k6-metrics-vps.sh "$SCENARIO" "$TEST_ID"

      - name: Compute performance test result
        id: k6_result
        if: always()
        shell: bash
        run: |
          end_epoch=$(date +%s)
          duration_ms=$(( (end_epoch - ${{ steps.mark_start.outputs.epoch }}) * 1000 ))
          status="failed"
          if [ "${{ steps.run_k6.outcome }}" = "success" ] && [ "${{ steps.wait_metrics.outcome || 'success' }}" = "success" ]; then
            status="passed"
          fi
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Log performance test result to Loki source file
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            BACKEND_PATH="${VPS_BACKEND_PATH:-/opt/it-job/it-job-platform}"
            cd "$BACKEND_PATH"

            AUTOMATION_SUITE="performance-testing" \
            AUTOMATION_KIND="${{ github.event.inputs.scenario || 'smoke' }}" \
            AUTOMATION_SOURCE="github-actions" \
            AUTOMATION_STATUS="${{ steps.k6_result.outputs.status }}" \
            AUTOMATION_DURATION_MS="${{ steps.k6_result.outputs.duration_ms }}" \
            AUTOMATION_RUN_ID="${{ github.run_id }}" \
            AUTOMATION_RUN_URL="${{ env.AUTOMATION_RUN_URL }}" \
            AUTOMATION_REPOSITORY="${{ github.repository }}" \
            AUTOMATION_WORKFLOW="${{ github.workflow }}" \
            AUTOMATION_SCENARIO="${{ github.event.inputs.scenario || 'smoke' }}" \
            AUTOMATION_TEST_ID="${{ github.event.inputs.test_id || format('github-run-{0}', github.run_id) }}" \
            AUTOMATION_SUMMARY="performance test workflow completed with status ${{ steps.k6_result.outputs.status }} for scenario ${{ github.event.inputs.scenario || 'smoke' }}." \
            bash ./scripts/dev/write-automation-log.sh

      - name: Fail workflow when performance test fails
        if: steps.run_k6.outcome != 'success' || (steps.run_k6.outcome == 'success' && steps.wait_metrics.outcome == 'failure')
        shell: bash
        run: |
          echo "performance test failed or Prometheus metrics were not visible in time." >&2
          exit 1
