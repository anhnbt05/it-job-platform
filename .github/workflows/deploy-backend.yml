name: Deploy Backend VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_seed:
        description: Run migrate and seed after deploy
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend-vps
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.changes.outputs.build_matrix }}
      changed_service_count: ${{ steps.changes.outputs.changed_service_count }}
      changed_services_csv: ${{ steps.changes.outputs.changed_services_csv }}
      has_service_changes: ${{ steps.changes.outputs.has_service_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed backend services
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          ALL_SERVICES_JSON='[
            {"service":"identity-service","context":"./services/identity-service","image_repo":"it-job-platform-identity-service"},
            {"service":"organization-service","context":"./services/organization-service","image_repo":"it-job-platform-organization-service"},
            {"service":"notification-service","context":"./services/notification-service","image_repo":"it-job-platform-notification-service"},
            {"service":"job-service","context":"./services/job-service","image_repo":"it-job-platform-job-service"},
            {"service":"application-service","context":"./services/application-service","image_repo":"it-job-platform-application-service"},
            {"service":"dashboard-service","context":"./services/dashboard-service","image_repo":"it-job-platform-dashboard-service"}
          ]'

          write_build_matrix() {
            local matrix_json="$1"
            {
              echo "build_matrix<<EOF"
              echo "$matrix_json"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            write_build_matrix "{\"include\":$ALL_SERVICES_JSON}"
            echo "changed_service_count=6" >> "$GITHUB_OUTPUT"
            echo "changed_services_csv=identity-service,organization-service,notification-service,job-service,application-service,dashboard-service" >> "$GITHUB_OUTPUT"
            echo "has_service_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE_SHA="${{ github.event.before }}"
          CURRENT_SHA="${{ github.sha }}"

          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            write_build_matrix "{\"include\":$ALL_SERVICES_JSON}"
            echo "changed_service_count=6" >> "$GITHUB_OUTPUT"
            echo "changed_services_csv=identity-service,organization-service,notification-service,job-service,application-service,dashboard-service" >> "$GITHUB_OUTPUT"
            echo "has_service_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")

          declare -A changed_services=()
          ordered_services=(
            identity-service
            organization-service
            notification-service
            job-service
            application-service
            dashboard-service
          )

          append_service_metadata() {
            local service="$1"

            case "$service" in
              identity-service)
                service_entries+=('{"service":"identity-service","context":"./services/identity-service","image_repo":"it-job-platform-identity-service"}')
                ;;
              organization-service)
                service_entries+=('{"service":"organization-service","context":"./services/organization-service","image_repo":"it-job-platform-organization-service"}')
                ;;
              notification-service)
                service_entries+=('{"service":"notification-service","context":"./services/notification-service","image_repo":"it-job-platform-notification-service"}')
                ;;
              job-service)
                service_entries+=('{"service":"job-service","context":"./services/job-service","image_repo":"it-job-platform-job-service"}')
                ;;
              application-service)
                service_entries+=('{"service":"application-service","context":"./services/application-service","image_repo":"it-job-platform-application-service"}')
                ;;
              dashboard-service)
                service_entries+=('{"service":"dashboard-service","context":"./services/dashboard-service","image_repo":"it-job-platform-dashboard-service"}')
                ;;
            esac
          }

          for path in "${changed_files[@]}"; do
            case "$path" in
              services/identity-service/*)
                changed_services["identity-service"]=1
                ;;
              services/organization-service/*)
                changed_services["organization-service"]=1
                ;;
              services/notification-service/*)
                changed_services["notification-service"]=1
                ;;
              services/job-service/*)
                changed_services["job-service"]=1
                ;;
              services/application-service/*)
                changed_services["application-service"]=1
                ;;
              services/dashboard-service/*)
                changed_services["dashboard-service"]=1
                ;;
            esac
          done

          service_entries=()
          changed_service_names=()
          for service in "${ordered_services[@]}"; do
            if [[ -n "${changed_services[$service]:-}" ]]; then
              append_service_metadata "$service"
              changed_service_names+=("$service")
            fi
          done

          changed_count="${#service_entries[@]}"
          changed_services_csv=""
          if (( changed_count == 0 )); then
            changed_json='{"include":[]}'
          else
            joined_entries="$(IFS=,; echo "${service_entries[*]}")"
            changed_json="{\"include\":[${joined_entries}]}"
            changed_services_csv="$(IFS=,; echo "${changed_service_names[*]}")"
          fi

          write_build_matrix "$changed_json"
          echo "changed_service_count=$changed_count" >> "$GITHUB_OUTPUT"
          echo "changed_services_csv=$changed_services_csv" >> "$GITHUB_OUTPUT"

          if [[ "$changed_count" == "0" ]]; then
            echo "has_service_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_service_changes=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_service_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.build_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: prep
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push ${{ matrix.service }} with retry
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_BASE="ghcr.io/${{ steps.prep.outputs.owner }}/${{ matrix.image_repo }}"
          TAG_MAIN="${IMAGE_BASE}:main"
          TAG_SHA="${IMAGE_BASE}:sha-${{ github.sha }}"

          attempt=1
          max_attempts=3

          until [ "$attempt" -gt "$max_attempts" ]; do
            echo "Build/push attempt ${attempt}/${max_attempts} for ${{ matrix.service }}"

            if docker buildx build \
              --file "${{ matrix.context }}/Dockerfile" \
              --tag "${TAG_MAIN}" \
              --tag "${TAG_SHA}" \
              --cache-from "type=gha,scope=${{ matrix.image_repo }}" \
              --cache-to "type=gha,mode=max,scope=${{ matrix.image_repo }}" \
              --push \
              "${{ matrix.context }}"; then
              echo "Build/push succeeded for ${{ matrix.service }}"
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Build/push failed after ${max_attempts} attempts"
              exit 1
            fi

            sleep_seconds=$((attempt * 20))
            echo "Transient build/push failure. Retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
            attempt=$((attempt + 1))
          done

  deploy:
    needs:
      - detect-changes
      - build-and-push
    if: always() && needs.detect-changes.result == 'success' && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      VPS_BACKEND_PATH: ${{ vars.VPS_BACKEND_PATH }}
      RUN_SEED_INPUT: ${{ github.event.inputs.run_seed }}
      DEPLOY_SERVICES_INPUT: ${{ needs.detect-changes.outputs.changed_services_csv }}
    steps:
      - name: Deploy backend stack over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 45m
          script: |
            set -euo pipefail

            BACKEND_PATH="${VPS_BACKEND_PATH:-/opt/it-job/it-job-platform}"
            RUN_SEED_FLAG=0
            if [ "${RUN_SEED_INPUT:-false}" = "true" ]; then
              RUN_SEED_FLAG=1
            fi

            echo '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

            cd "$BACKEND_PATH"
            PREVIOUS_HEAD="$(git rev-parse HEAD 2>/dev/null || true)"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd
            CURRENT_HEAD="$(git rev-parse HEAD)"

            PREVIOUS_DEPLOY_SHA="$PREVIOUS_HEAD" \
            CURRENT_DEPLOY_SHA="$CURRENT_HEAD" \
            RUN_SEED="$RUN_SEED_FLAG" \
            DEPLOY_SERVICES_INPUT="${DEPLOY_SERVICES_INPUT:-}" \
            bash ./scripts/dev/deploy-backend-vps.sh
            docker image prune -f
            docker logout ghcr.io || true
