name: Graceful Degradation Demo
run-name: Graceful Degradation | ${{ inputs.test_id || format('github-run-{0}', github.run_id) }}

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: Tag used in Loki/Grafana for this demo run
        required: false
        default: ""
        type: string
      start_date:
        description: Start date used when querying dashboard summary
        required: false
        default: "2026-01-01"
        type: string
      end_date:
        description: End date used when querying dashboard summary
        required: false
        default: "2026-12-31"
        type: string

permissions:
  contents: read

concurrency:
  group: graceful-degradation-demo
  cancel-in-progress: false

jobs:
  graceful-degradation-demo:
    runs-on: ubuntu-latest
    env:
      VPS_BACKEND_PATH: ${{ vars.VPS_BACKEND_PATH }}
      AUTOMATION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TEST_ID_INPUT: ${{ github.event.inputs.test_id || format('github-run-{0}', github.run_id) }}
      START_DATE_INPUT: ${{ github.event.inputs.start_date || '2026-01-01' }}
      END_DATE_INPUT: ${{ github.event.inputs.end_date || '2026-12-31' }}
    steps:
      - name: Mark graceful degradation demo start
        id: mark_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Sync backend repo on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail

            BACKEND_PATH="${VPS_BACKEND_PATH:-/opt/it-job/it-job-platform}"
            cd "$BACKEND_PATH"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd

      - name: Step 1 - Verify healthy baseline
        id: baseline
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            BACKEND_PATH="${VPS_BACKEND_PATH:-/opt/it-job/it-job-platform}"
            cd "$BACKEND_PATH"
            START_DATE="${{ env.START_DATE_INPUT }}" END_DATE="${{ env.END_DATE_INPUT }}" \
            bash ./scripts/dev/demo-graceful-degradation-vps.sh baseline

      - name: Step 2 - Inject job-service failure
        id: inject_failure
        if: steps.baseline.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            BACKEND_PATH="${VPS_BACKEND_PATH:-/opt/it-job/it-job-platform}"
            cd "$BACKEND_PATH"
            START_DATE="${{ env.START_DATE_INPUT }}" END_DATE="${{ env.END_DATE_INPUT }}" \
            bash ./scripts/dev/demo-graceful-degradation-vps.sh inject-failure

      - name: Step 3 - Verify dashboard degraded gracefully
        id: check_degraded
        if: steps.inject_failure.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            BACKEND_PATH="${VPS_BACKEND_PATH:-/opt/it-job/it-job-platform}"
            cd "$BACKEND_PATH"
            START_DATE="${{ env.START_DATE_INPUT }}" END_DATE="${{ env.END_DATE_INPUT }}" \
            bash ./scripts/dev/demo-graceful-degradation-vps.sh check-degraded

      - name: Step 4 - Recover job-service
        id: recover
        if: always() && steps.inject_failure.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            BACKEND_PATH="${VPS_BACKEND_PATH:-/opt/it-job/it-job-platform}"
            cd "$BACKEND_PATH"
            START_DATE="${{ env.START_DATE_INPUT }}" END_DATE="${{ env.END_DATE_INPUT }}" \
            bash ./scripts/dev/demo-graceful-degradation-vps.sh recover

      - name: Step 5 - Verify dashboard recovered
        id: verify_recovered
        if: always() && steps.recover.outcome == 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            BACKEND_PATH="${VPS_BACKEND_PATH:-/opt/it-job/it-job-platform}"
            cd "$BACKEND_PATH"
            START_DATE="${{ env.START_DATE_INPUT }}" END_DATE="${{ env.END_DATE_INPUT }}" \
            bash ./scripts/dev/demo-graceful-degradation-vps.sh verify-recovered

      - name: Compute demo result
        id: demo_result
        if: always()
        shell: bash
        run: |
          end_epoch=$(date +%s)
          duration_ms=$(( (end_epoch - ${{ steps.mark_start.outputs.epoch }}) * 1000 ))
          status="failed"

          if [ "${{ steps.baseline.outcome }}" = "success" ] \
            && [ "${{ steps.inject_failure.outcome || 'skipped' }}" = "success" ] \
            && [ "${{ steps.check_degraded.outcome || 'skipped' }}" = "success" ] \
            && [ "${{ steps.recover.outcome || 'skipped' }}" = "success" ] \
            && [ "${{ steps.verify_recovered.outcome || 'skipped' }}" = "success" ]; then
            status="passed"
          fi

          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Graceful Degradation Demo"
            echo ""
            echo "- Test ID: \`${TEST_ID_INPUT}\`"
            echo "- Baseline: \`${{ steps.baseline.outcome }}\`"
            echo "- Inject failure: \`${{ steps.inject_failure.outcome || 'skipped' }}\`"
            echo "- Check degraded: \`${{ steps.check_degraded.outcome || 'skipped' }}\`"
            echo "- Recover: \`${{ steps.recover.outcome || 'skipped' }}\`"
            echo "- Verify recovered: \`${{ steps.verify_recovered.outcome || 'skipped' }}\`"
            echo "- Final status: \`${{ steps.demo_result.outputs.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log graceful degradation result to Loki source file
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            BACKEND_PATH="${VPS_BACKEND_PATH:-/opt/it-job/it-job-platform}"
            cd "$BACKEND_PATH"

            AUTOMATION_SUITE="design-for-failure" \
            AUTOMATION_KIND="graceful-degradation" \
            AUTOMATION_SOURCE="github-actions" \
            AUTOMATION_STATUS="${{ steps.demo_result.outputs.status }}" \
            AUTOMATION_DURATION_MS="${{ steps.demo_result.outputs.duration_ms }}" \
            AUTOMATION_RUN_ID="${{ github.run_id }}" \
            AUTOMATION_RUN_URL="${{ env.AUTOMATION_RUN_URL }}" \
            AUTOMATION_REPOSITORY="${{ github.repository }}" \
            AUTOMATION_WORKFLOW="${{ github.workflow }}" \
            AUTOMATION_SCENARIO="job-service-down" \
            AUTOMATION_TEST_ID="${{ env.TEST_ID_INPUT }}" \
            AUTOMATION_SUMMARY="graceful degradation demo completed with status ${{ steps.demo_result.outputs.status }}." \
            bash ./scripts/dev/write-automation-log.sh

      - name: Fail workflow when graceful degradation demo fails
        if: steps.demo_result.outputs.status != 'passed'
        shell: bash
        run: |
          echo "graceful degradation demo failed." >&2
          exit 1
