services:
  identity-postgres:
    image: postgres:15
    container_name: identity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IDENTITY_POSTGRES_DB:-identity_db}
      POSTGRES_USER: ${IDENTITY_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${IDENTITY_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${IDENTITY_POSTGRES_BIND_HOST:-127.0.0.1}:${IDENTITY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    networks:
      - it-job-network

  job-postgres:
    image: postgres:16-alpine
    container_name: job-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${JOB_POSTGRES_DB:-job_db}
      POSTGRES_USER: ${JOB_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${JOB_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${JOB_POSTGRES_BIND_HOST:-127.0.0.1}:${JOB_POSTGRES_PORT:-5433}:5432"
    volumes:
      - job_postgres_data:/var/lib/postgresql/data
    networks:
      - it-job-network

  notification-postgres:
    image: postgres:15
    container_name: notification-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB:-notification_db}
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${NOTIFICATION_POSTGRES_BIND_HOST:-127.0.0.1}:${NOTIFICATION_POSTGRES_PORT:-5434}:5432"
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    networks:
      - it-job-network

  dashboard-postgres:
    image: postgres:16-alpine
    container_name: dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DASHBOARD_POSTGRES_DB:-dashboard_db}
      POSTGRES_USER: ${DASHBOARD_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DASHBOARD_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DASHBOARD_POSTGRES_BIND_HOST:-127.0.0.1}:${DASHBOARD_POSTGRES_PORT:-5435}:5432"
    volumes:
      - dashboard_postgres_data:/var/lib/postgresql/data
    networks:
      - it-job-network

  organization-mysql:
    image: mysql:8
    container_name: organization-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${ORGANIZATION_MYSQL_DB:-organization_db}
      MYSQL_USER: ${ORGANIZATION_MYSQL_USER:-organization}
      MYSQL_PASSWORD: ${ORGANIZATION_MYSQL_PASSWORD:-organization}
      MYSQL_ROOT_PASSWORD: ${ORGANIZATION_MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${ORGANIZATION_MYSQL_BIND_HOST:-127.0.0.1}:${ORGANIZATION_MYSQL_PORT:-3306}:3306"
    volumes:
      - organization_mysql_data:/var/lib/mysql
    networks:
      - it-job-network

  application-mongo:
    image: mongo:7
    container_name: application-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${APPLICATION_MONGO_DB:-application_db}
    ports:
      - "${APPLICATION_MONGO_BIND_HOST:-127.0.0.1}:${APPLICATION_MONGO_PORT:-27018}:27017"
    volumes:
      - application_mongo_data:/data/db
    networks:
      - it-job-network

  redis:
    image: redis:7-alpine
    container_name: it-job-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    networks:
      - it-job-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID:-1}@kafka:${KAFKA_CONTROLLER_PORT:-29093}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:${KAFKA_BROKER_PORT:-9092},PLAINTEXT_HOST://:${KAFKA_EXTERNAL_PORT:-29092},CONTROLLER://:${KAFKA_CONTROLLER_PORT:-29093}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:-PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    ports:
      - "${KAFKA_BROKER_PORT:-9092}:${KAFKA_BROKER_PORT:-9092}"
      - "${KAFKA_EXTERNAL_PORT:-29092}:${KAFKA_EXTERNAL_PORT:-29092}"
    volumes:
      - ./infrastructure/kafka/scripts:/scripts
      - kafka_data:/var/lib/kafka/data
    networks:
      - it-job-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_INTERNAL_BROKER:-kafka:9092}
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    networks:
      - it-job-network

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./infrastructure/kafka/scripts:/scripts
    networks:
      - it-job-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - it-job-network
      - observability

  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infrastructure/observability/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - observability

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infrastructure/observability/promtail/promtail-config.yml:/etc/promtail/config.yml
      - ./runtime-logs:/workspace/runtime-logs
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "${GRAFANA_PORT:-3005}:3000"
    networks:
      - observability

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    networks:
      - it-job-network
      - observability

  kong:
    image: kong:3.6
    container_name: kong-gateway
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:${KONG_ADMIN_PORT:-8001}
      KONG_TRACING_INSTRUMENTATIONS: all
      KONG_TRACING_SAMPLING_RATE: "1.0"
    volumes:
      - ./gateway/kong/kong.yml:/usr/local/kong/declarative/kong.yml
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_ADMIN_PORT:-8001}:${KONG_ADMIN_PORT:-8001}"
    networks:
      - it-job-network

networks:
  it-job-network:
    name: it-job-network
  observability:
    name: observability

volumes:
  identity_postgres_data:
  job_postgres_data:
  notification_postgres_data:
  dashboard_postgres_data:
  organization_mysql_data:
  application_mongo_data:
  redis_data:
  kafka_data:
  loki_data:
