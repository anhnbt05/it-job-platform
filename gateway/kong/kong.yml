_format_version: "3.0"
_transform: true

services:
  - name: identity-service
    url: http://identity-service:3001
    routes:
      - name: identity-route
        paths:
          - /identity
        strip_path: true

  - name: organization-service
    url: http://organization-service:3002
    routes:
      - name: organization-route
        paths:
          - /organization
        strip_path: true

  - name: notification-service
    url: http://notification-service:3003
    routes:
      - name: notification-route
        paths:
          - /notification
        strip_path: true

  - name: job-service
    url: http://job-service:8081
    routes:
      - name: job-route
        paths:
          - /jobs
        strip_path: false

  - name: application-service
    url: http://application-service:8082
    routes:
      - name: application-route
        paths:
          - /applications
        strip_path: false

  - name: dashboard-service
    url: http://dashboard-service:8083
    routes:
      - name: dashboard-route
        paths:
          - /dashboard
        strip_path: false
