_format_version: "3.0"
_transform: true

services:
  - name: identity-service
    url: http://host.docker.internal:3001
    routes:
      - name: identity-route
        paths:
          - /identity
        strip_path: true

  - name: organization-service
    url: http://host.docker.internal:3002
    routes:
      - name: organization-route
        paths:
          - /organization
        strip_path: true

  - name: notification-service
    url: http://host.docker.internal:3003
    routes:
      - name: notification-route
        paths:
          - /notification
        strip_path: true

  - name: job-service
    url: http://host.docker.internal:8082
    routes:
      - name: job-route
        paths:
          - /jobs
        strip_path: false

  - name: application-service
    url: http://host.docker.internal:8083
    routes:
      - name: application-route
        paths:
          - /applications
        strip_path: false

  - name: dashboard-service
    url: http://host.docker.internal:8084
    routes:
      - name: dashboard-route
        paths:
          - /dashboard
        strip_path: false
