server:
  port: 8084
  servlet:
    context-path: /api

spring:
  application:
    name: dashboard-service

# Feign clients
job-service:
  url: ${JOB_SERVICE_URL:http://localhost:8082/api}
application-service:
  url: ${APPLICATION_SERVICE_URL:http://localhost:8083/api}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
