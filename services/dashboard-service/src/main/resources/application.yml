server:
  port: 8084
  servlet:
    context-path: /api

spring:
  application:
    name: dashboard-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 4000

app:
  observability:
    log-file: ${OBSERVABILITY_LOG_FILE:../../runtime-logs/dashboard-service.log}

# Feign clients
job-service:
  url: ${JOB_SERVICE_URL:http://localhost:8082/api}
application-service:
  url: ${APPLICATION_SERVICE_URL:http://localhost:8083/api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
